# .what = curates which of this repo's own briefs load in FULL at session start
#
# .why  = `briefs/domain.terms/` and `briefs/evidence/` hold the full term clusters and
#         the dated incident records behind the supervisor + prioritizer roles. they are
#         kept here, unpublished, so an enrolled brain meets only each role's terse
#         `glossary.md`. they are REFERENCE — fetched when a verdict needs the record —
#         and at several hundred K chars they would dwarf every other brief if said.
#
# .mode = SUBJECT (the `always:` key): the say glob and the ref globs apply together.

budget:
  tokens: 30_000
always:
  briefs:
    say:
      # the repo's own top-level lessons and rules — unchanged from before this file
      - briefs/*.md
    ref:
      - briefs/domain.terms/**
      - briefs/evidence/**
    # .why not: each reason and example path is one ref line, ~70 of them, and they
    #      pushed this boot past its 30k budget. no path is lost: every
    #      `term=*._.choice._.md` names its own reason file under `## .reason`, so a
    #      reader computes it from the cluster it already holds
    #      (rule.always.boot-an-oversized-subdomain-as-its-catalog)
    not:
      - briefs/domain.terms/term=*._.choice.reason.md
      - briefs/domain.terms/term=*._.choice.example=*.md
  skills:
    say:
      - skills/**
