# dpdm exclude patterns — each entry is joined with | into a single --exclude regex.
#
# an empty `exclude: []` means dpdm checks every file for cycles, node_modules included. this is
# the org policy `rule.forbid.dpdm-exclude-change`: we check dependencies too, because a prod-dep
# cycle ships to consumers.
#
# when an entry is allowed:
# - a type-only cycle: never. --transform erases type imports before analysis, so none is owed
# - a test file: never. the '!(*.test).ts' glob already drops test files
# - a require cycle inside a third-party devDependency: allowed, one entry per package, each with
#   a comment that cites the cycle and the upstream issue
# - a require cycle inside a prod dependency: never. it ships to consumers — dispatch the fix
#   upstream or replace the dependency
#
# an entry of `node_modules` (or dpdm's own `/node_modules/` default) disables the check across
# every consumer repo, and the declapract check rejects it.
exclude:
  # ⚠️ prod-dep exceptions, held until upstream bumps them (see the pr for the commander's call):
  # emoji-space-shim@0.0.0 (a prod dep) → as-procedure → helpful-errors@1.5.3 and domain-objects@0.31.x.
  # upstream: ehmpathy/emoji-space-shim#17
  # helpful-errors@1.5.3: HelpfulError.js ↔ withHelpfulError.js. fixed by 1.7.x (our own direct pin)
  - 'node_modules/\.pnpm/helpful-errors@1\.5\.3/'
  # domain-objects@0.31.x: DomainObject.js ↔ hydrateNestedDomainObjects.js. fixed by 0.34.x (our own direct pin)
  - 'node_modules/\.pnpm/domain-objects@0\.31\.'
  # devDependency / peer cycles, all under rhachet's tree. upstream: ehmpathy/rhachet#729
  # rhachet@1.51.0: weave/enweaveOneStitcher.js ↔ enweaveOne{Choice,Cycle,Fanout,Route}.js
  - 'node_modules/\.pnpm/rhachet@'
  # declastruct-aws@1.5.2 (via rhachet): contract/sdks/index.js ↔ provider/getDeclastructAwsProvider.js
  - 'node_modules/\.pnpm/declastruct-aws@'
  # @aws-sdk (third-party, via declastruct-aws): STSClient.js ↔ auth/httpAuthSchemeProvider.js
  - 'node_modules/\.pnpm/@aws-sdk\+'
