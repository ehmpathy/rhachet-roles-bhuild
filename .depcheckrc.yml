# .what = paths depcheck must not scan (gitignore syntax)
# .why  = `.agent/` holds linked role artifacts and per-actor runtime scratch —
#         `.agent/.actors/<actor>/brain/.claude/plugins/**` caches claude-code
#         plugin marketplaces, whose own test files import packages this repo
#         does not depend on. depcheck reported one as a MISSING dependency
#         (`claude-code`), so `test:lint` failed on a file that is gitignored
#         and is not this package's source. none of `.agent/` ever is.
ignore-patterns:
  - .agent

ignores:
  - depcheck
  - declapract
  - declapract-typescript-ehmpathy
  - "@commitlint/config-conventional"
  - serverless-prune-plugin
  - husky
  - if-env
  - rhachet
  - "@tsconfig/node20"
  - "@tsconfig/strictest"
  - "@biomejs/biome"
  - esbuild-register
  - "@swc/core"
  - "@swc/jest"
  - tsc-alias
  - tsx
  - "@src/*"
  - "@src/.*"
  - yalc
  - rhachet-roles-bhuild
  - "@anthropic-ai/claude-code"
  - rhachet-brains-anthropic
  - rhachet-roles-bhrain
  - rhachet-roles-ehmpathy
  - rhachet-roles-rhachet
