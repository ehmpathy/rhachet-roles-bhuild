# .budget = the shipped boot payload, in o200k tokens, as a consumer seat renders it;
#   frozen at its cost when declared, rounded up to the next 100. the boot-budget
#   clamp turns red the moment the boot outgrows it.
#   measure: `npx rhachet roles cost --what src/domain.roles/decomposer/boot.yml`
budget:
  tokens: 500

always:
  briefs:
    say: []

    ref:
      # decompose rules
      - briefs/decompose/rule.require.contexts.bounded.md
      - briefs/decompose/rule.require.dependencies.directional.md
      - briefs/decompose/rule.require.wish.scoped.md
      - briefs/decompose/rule.require.vision.scoped.md
      - briefs/decompose/rule.require.names.ubiquitous.md

      # review rules
      - briefs/review/rule.require.context.threshold.md
      - briefs/review/rule.require.domain.bounded.md

      # the seam with the prioritizer — landed by the supervisor/prioritizer lift,
      # per ehmpathy/rhachet-roles-bhuild#385 deliverable 1, which names THIS role
      # as its home. it is a `ref` rather than a `say` because a decomposer needs it
      # only once it meets a goal tree, and a reader who suspects it exists can fetch
      # it by name — the boot manifest's own test for ref-level legitimacy.
      - briefs/define.decomposer-prioritizer-intersection.md

  skills:
    # the tests and their fixture repos never ship, so they never boot; listed here so a
    # `roles cost` on the src spec reads what a seat is handed
    not:
      - skills/**/*.test.ts
      # a glob skips dot dirs, so the fixture repos' `.behavior/` needs its own segment
      - skills/.test/assets/example.repo/*/.behavior/*/*.md
