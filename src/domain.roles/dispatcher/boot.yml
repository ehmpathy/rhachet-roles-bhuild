# .what = curates what this role boots, and caps it
#
# .why  = every role this repo ships boots under a declared budget, no exceptions.
#         this file declares the boot the role already had: its readme, and every
#         skill header said in full, so a seat sees each radio verb with no fetch.
#
# .budget = the shipped boot payload, in o200k tokens, as a consumer seat renders it
#   (`.agent/repo=bhuild/role=dispatcher/`, a little more than `src/`), frozen at its
#   cost when declared, rounded up to the next 100. the boot-budget clamp turns red
#   the moment the boot outgrows it.
#   measure: `npx rhachet roles cost --what src/domain.roles/dispatcher/boot.yml`
budget:
  tokens: 2_800

always:
  briefs:
    say: []
    ref: []

  skills:
    say:
      - skills/*.sh
    # the tests and their snapshots never ship, so they never boot; listed here so a
    # `roles cost` on the src spec reads what a seat is handed
    not:
      - skills/**/*.ts
      - skills/__snapshots__/**
